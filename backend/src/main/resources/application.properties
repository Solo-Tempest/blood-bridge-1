# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bloodbridge
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=bG9uZ1NlY3JldEtleUZvckJsb29kQnJpZGdlQXBwbGljYXRpb25TZWNyZXRLZXkxMjM0NTY3ODk=
jwt.expiration=86400000

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/documents

# Logging
logging.level.com.bloodbridge=DEBUG

# OTP Configuration
# Switch to 'prod' when deploying with real Twilio credentials
otp.mode=dev
otp.expiry-minutes=5
otp.max-attempts=5
otp.rate-limit.max-requests=3
otp.rate-limit.window-minutes=10

# Twilio Configuration (set as environment variables in production)
# export TWILIO_ACCOUNT_SID=ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# export TWILIO_AUTH_TOKEN=your_auth_token
# export TWILIO_PHONE_NUMBER=+1xxxxxxxxxx
twilio.account-sid=${TWILIO_ACCOUNT_SID:ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
twilio.auth-token=${TWILIO_AUTH_TOKEN:your_auth_token_here}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+10000000000}
